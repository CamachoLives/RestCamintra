name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Linter
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas
        run: npm test -- --coverage
        env:
          # La suite no toca PostgreSQL: los repositorios van mockeados.
          NODE_ENV: test
          JWT_SECRET: secreto-solo-para-ci
